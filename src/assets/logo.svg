<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <mask id="iconMask2">
      <rect x="40" y="40" width="120" height="120" rx="32" fill="#ffffff"/>
      <circle cx="136" cy="40" r="9" fill="#000000"/>
    </mask>
  </defs>

  <!-- Icon: geometric squircle with ticket-punch notch -->
  <rect x="40" y="40" width="120" height="120" rx="32" fill="#FF365C" mask="url(#iconMask2)"/>

  <!-- Play mark, softly rounded via round line-join -->
  <polygon points="82,66 82,134 128,100"
           fill="#ffffff"
           stroke="#ffffff"
           stroke-width="9"
           stroke-linejoin="round"
           stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="190" y="118"
        font-family="'Sora','Outfit','Plus Jakarta Sans','Manrope',Arial,sans-serif"
        font-weight="700"
        font-size="64"
        letter-spacing="-1.5">
    <tspan fill="#ffffff">Movi</tspan><tspan fill="#FF365C">X</tspan><tspan fill="#ffffff">a</tspan>
  </text>

  <!-- Tagline -->
  <text x="193" y="150"
        font-family="'Sora','Outfit','Plus Jakarta Sans','Manrope',Arial,sans-serif"
        font-weight="500"
        font-size="13"
        letter-spacing="4"
        fill="#8A8A99">
    BOOK &#8226; WATCH &#8226; REPEAT
  </text>
</svg>
